name: Publicar portal no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rendas-digitais-portal
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mhay-cardapio-prototipo/package-lock.json
            umai-cardapio-prototipo/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
